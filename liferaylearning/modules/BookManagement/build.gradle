dependencies {
    // Liferay Portal API (compileOnly for provided scope)
    compileOnly group: "com.liferay.portal", name: "release.portal.api", version: "7.4.3.120-ga120"

    // MySQL JDBC driver (runtime only)
    runtimeOnly group: "mysql", name: "mysql-connector-java", version: "8.0.33"

    // Liferay CSS Builder (used in build process)
    cssBuilder group: "com.liferay", name: "com.liferay.css.builder", version: "3.1.4"

    // Dependency on BookService module's API
    api project(":modules:BookSe:BookSe-api")

    //api project(":modules:BookService11-api")  // not -service!
	compileOnly group: "javax.portlet", name: "portlet-api", version: "2.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	//compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "2.0.0"
	
	}




// Ensure UTF-8 encoding for Java compilation
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
